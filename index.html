<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>くらしと仕事の計算ツール</title>
  <meta name="description" content="パート・アルバイトの有給日数や営業日計算、家電の電気代、時給と年収の換算など、仕事とくらしの「これってどうなる？」をすぐ計算できる無料ツール集です。">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header>
    <h1>くらしと仕事の計算ツール</h1>
    <p class="lead">入力はすべて端末の中で計算し、どこにも送信しません。</p>
  </header>
  <main>
    <ul class="tools">
      <li>
        <a href="yukyu/">パート・アルバイトの有給は何日？</a><br>
        週の勤務日数と入社日から、法律上もらえる有給休暇の最低日数がわかります。
      </li>
      <li>
        <a href="eigyobi/">営業日計算</a><br>
        ○営業日後の日付や、期間の営業日数を計算します。土日・祝日・年末年始に対応。
      </li>
      <li>
        <a href="denkidai/">家電の電気代計算</a><br>
        消費電力と使う時間から、1時間・1日・1か月・1年の電気代がわかります。複数の家電の合計も。
      </li>
      <li>
        <a href="kyuyo/">時給・月給・年収の換算</a><br>
        時給・日給・月給・年収のどれか1つから、残りをまとめて換算します。労働時間や賞与にも対応。
      </li>
    </ul>
  </main>
  <footer></footer>
</body>
</html>
